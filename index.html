<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PavelCasino — Next Gen</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-base: #060907;
            --surface: rgba(18, 38, 28, 0.65);
            --surface-solid: #10261c;
            --gold: #f3ce73;
            --gold-gradient: linear-gradient(135deg, #fcebc4 0%, #f3ce73 50%, #c49635 100%);
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #8fa89b;
            --border-glass: rgba(243, 206, 115, 0.2);
        }

        body { 
            background: var(--bg-base); 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 70, 45, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(243, 206, 115, 0.08) 0%, transparent 50%);
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Модальное окно */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 6, 4, 0.85); backdrop-filter: blur(16px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-card { background: linear-gradient(145deg, #163827, #0b1c14); border: 1.5px solid var(--gold); border-radius: 28px; padding: 35px 24px; text-align: center; max-width: 340px; box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(243, 206, 115, 0.2); }
        .modal-card h2 { color: var(--gold); margin-bottom: 12px; font-size: 26px; font-weight: 900; letter-spacing: 0.5px; }
        .modal-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
        
        .btn-main { 
            background: var(--gold-gradient); 
            color: #06110b; 
            border: none; 
            padding: 16px; 
            font-weight: 900; 
            border-radius: 16px; 
            font-size: 15px; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 8px 25px rgba(243, 206, 115, 0.35);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .btn-main:active { transform: scale(0.96); filter: brightness(0.9); }
        .btn-main:disabled { background: #15291f; color: #436352; box-shadow: none; cursor: not-allowed; }

        .header { background: rgba(10, 20, 15, 0.8); backdrop-filter: blur(15px); padding: 14px 20px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-weight: 900; color: var(--gold); font-size: 18px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(243, 206, 115, 0.3); }
        .balance-badge { background: rgba(18, 38, 28, 0.9); border: 1.5px solid var(--border-glass); padding: 7px 16px; border-radius: 30px; color: var(--gold); font-weight: 800; font-size: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); }

        .content { flex: 1; padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .tab-page { display: none; width: 100%; text-align: center; max-width: 380px; }
        .tab-page.active { display: flex; flex-direction: column; align-items: center; }

        .game-card {
            width: 100%;
            background: var(--surface);
            backdrop-filter: blur(15px);
            border: 1.5px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ИДЕАЛЬНО ЗАКРЫТЫЙ 3D КУБ БЕЗ ДЫРОК */
        .scene { 
            width: 120px; 
            height: 120px; 
            perspective: 1000px; 
            margin: 5px auto 15px auto; 
        }
        .cube { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transform-style: preserve-3d; 
            transform: translateZ(-60px);
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        
        .cube-face { 
            position: absolute; 
            width: 120px; 
            height: 120px; 
            background: #fdfbf7; 
            border: 2px solid #e0d8c3;
            border-radius: 20px; 
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Псевдоэлемент для заливки ребер и полного устранения щелей */
        .cube-face::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: #fdfbf7;
            border-radius: 20px;
            z-index: -1;
        }

        .dot { 
            background: #1a1a1a; 
            border-radius: 50%; 
            width: 18px; 
            height: 18px; 
            margin: auto;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.5);
        }
        .dot.gold { background: #b8860b; }

        .cube-face-1  { transform: rotateY(0deg) translateZ(60px); }
        .cube-face-6  { transform: rotateY(180deg) translateZ(60px); }
        .cube-face-3  { transform: rotateY(90deg) translateZ(60px); }
        .cube-face-4  { transform: rotateY(-90deg) translateZ(60px); }
        .cube-face-2  { transform: rotateX(90deg) translateZ(60px); }
        .cube-face-5  { transform: rotateX(-90deg) translateZ(60px); }

        .choice-grid { display: flex; gap: 10px; width: 100%; }
        .choice-item { 
            flex: 1; 
            background: rgba(10, 20, 15, 0.6); 
            border: 1.5px solid rgba(255,255,255,0.06); 
            border-radius: 16px; 
            padding: 12px 10px; 
            cursor: pointer; 
            transition: all 0.25s ease;
            text-align: center;
        }
        .choice-item .title { font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 3px; }
        .choice-item .sub { font-size: 11px; color: var(--gold); opacity: 0.8; font-weight: 600; }
        .choice-item.selected { 
            background: rgba(243, 206, 115, 0.12); 
            border-color: var(--gold); 
            box-shadow: 0 0 20px rgba(243, 206, 115, 0.15);
            transform: translateY(-2px);
        }
        .choice-item.selected .title { color: var(--gold); }

        .bet-card { 
            width: 100%; 
            background: var(--surface);
            backdrop-filter: blur(15px);
            border: 1.5px solid var(--border-glass); 
            border-radius: 24px; 
            padding: 16px; 
            margin-bottom: 14px; 
        }
        .section-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 800; margin-bottom: 10px; display: block; text-align: left; }
        .chips-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .chip-pill { 
            flex: 1; 
            background: rgba(16, 38, 28, 0.8); 
            border: 1px solid var(--border-glass); 
            color: var(--gold); 
            padding: 9px 0; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 12px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .chip-pill:active { background: var(--gold); color: #06110b; transform: scale(0.95); }
        .bet-input-box { 
            width: 100%; 
            background: rgba(4, 12, 8, 0.8); 
            border: 1.5px solid var(--border-glass); 
            color: var(--gold); 
            padding: 12px; 
            border-radius: 14px; 
            text-align: center; 
            font-size: 18px; 
            font-weight: 900; 
            outline: none; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .admin-panel { background: var(--surface); backdrop-filter: blur(15px); border: 1.5px dashed var(--gold); border-radius: 24px; padding: 20px; width: 100%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .admin-panel h4 { color: var(--gold); margin-bottom: 16px; text-align: center; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 900; }
        .admin-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: var(--text-main); }
        .admin-line select, .admin-line button { background: #10261c; color: var(--gold); border: 1.5px solid var(--gold); padding: 9px 14px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 12px; }

        .nav-dock { display: flex; background: rgba(6, 12, 9, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border-glass); height: 74px; padding-bottom: 6px; z-index: 10; }
        .dock-item { flex: 1; background: none; border: none; color: var(--text-muted); font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: 0.25s; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .dock-item.active { color: var(--gold); text-shadow: 0 0 12px rgba(243, 206, 115, 0.4); }
        .dock-item span { font-size: 22px; transition: transform 0.2s; }
        .dock-item.active span { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="modal-overlay" id="welcomeModal">
        <div class="modal-card">
            <h2>PavelCasino</h2>
            <p>Премиальный игровой зал открыт.<br><br>Вам зачислено <b>1,000 фишек</b> на счёт. Сделайте свой выбор!</p>
            <button class="btn-main" onclick="closeModal()">Войти в игру</button>
        </div>
    </div>

    <div class="header">
        <div class="logo">Pavel Casino</div>
        <div class="balance-badge">💎 <span id="balance">1000</span></div>
    </div>

    <div class="content">
        <div id="tab-games" class="tab-page active">
            
            <div class="game-card">
                <span class="section-label" style="text-align: center; margin-bottom: 5px;">3D Кинематографичный бросок</span>
                <div class="scene">
                    <div class="cube" id="cube">
                        <div class="cube-face cube-face-1">
                            <div></div><div></div><div></div>
                            <div></div><div class="dot gold"></div><div></div>
                            <div></div><div></div><div></div>
                        </div>
                        <div class="cube-face cube-face-6">
                            <div class="dot"></div><div></div><div class="dot"></div>
                            <div class="dot"></div><div></div><div class="dot"></div>
                            <div class="dot"></div><div></div><div class="dot"></div>
                        </div>
                        <div class="cube-face cube-face-3">
                            <div class="dot"></div><div></div><div></div>
                            <div></div><div class="dot"></div><div></div>
                            <div></div><div></div><div class="dot"></div>
                        </div>
                        <div class="cube-face cube-face-4">
                            <div class="dot"></div><div></div><div class="dot"></div>
                            <div></div><div></div><div></div>
                            <div class="dot"></div><div></div><div class="dot"></div>
                        </div>
                        <div class="cube-face cube-face-2">
                            <div class="dot"></div><div></div><div></div>
                            <div></div><div></div><div></div>
                            <div></div><div></div><div class="dot"></div>
                        </div>
                        <div class="cube-face cube-face-5">
                            <div class="dot"></div><div></div><div class="dot"></div>
                            <div></div><div class="dot"></div><div></div>
                            <div class="dot"></div><div></div><div class="dot"></div>
                        </div>
                    </div>
                </div>

                <div class="choice-grid">
                    <div class="choice-item selected" id="cardEven" onclick="selectChoice('even')">
                        <div class="title">Чётное</div>
                        <div class="sub">2, 4, 6 (x2)</div>
                    </div>
                    <div class="choice-item" id="cardOdd" onclick="selectChoice('odd')">
                        <div class="title">Нечётное</div>
                        <div class="sub">1, 3, 5 (x2)</div>
                    </div>
                </div>
            </div>

            <div class="bet-card">
                <span class="section-label">Сумма ставки</span>
                <div class="chips-container">
                    <button class="chip-pill" onclick="setBet(50)">50</button>
                    <button class="chip-pill" onclick="setBet(100)">100</button>
                    <button class="chip-pill" onclick="setBet(250)">250</button>
                    <button class="chip-pill" onclick="setBet(500)">500</button>
                </div>
                <input type="number" id="betAmount" class="bet-input-box" value="100" min="10" step="10">
            </div>

            <button class="btn-main" id="rollBtn" onclick="rollDice()">Бросить кубик (5 сек) 🎲</button>
        </div>

        <div id="tab-wallet" class="tab-page">
            <div class="game-card" style="width: 100%;">
                <span class="section-label" style="text-align: center;">Касса клуба</span>
                <div style="font-size: 32px; font-weight: 900; color: var(--gold); margin: 10px 0 5px 0;">💎 <span id="walletBalance">1000</span></div>
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Активный баланс счета</div>
            </div>
            <button class="btn-main" id="bonusBtn" onclick="addBonus()">Забрать бонус (+500 💎)</button>
            <p id="bonusTimer" style="margin-top: 16px; font-size: 12px; color: var(--text-muted); font-weight: 600;"></p>
        </div>

        <div id="tab-profile" class="tab-page">
            <div class="admin-panel">
                <h4>Панель организатора</h4>
                <div class="admin-line">
                    <span>Быстрый капитал:</span>
                    <button onclick="adminAddMoney()">+10,000 💎</button>
                </div>
                <div class="admin-line" style="margin-top: 15px;">
                    <span>Исход броска:</span>
                    <select id="winChance" onchange="changeChance()">
                        <option value="random">Честный рандом</option>
                        <option value="win">Гарантированная победа</option>
                        <option value="lose">Гарантированный проигрыш</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-dock">
        <button class="dock-item active" onclick="switchTab('games', this)">
            <span>🎲</span> Игра
        </button>
        <button class="dock-item" onclick="switchTab('wallet', this)">
            <span>💎</span> Касса
        </button>
        <button class="dock-item" onclick="switchTab('profile', this)">
            <span>⚙️</span> Админ
        </button>
    </div>

    <script>
        let balance = 1000;
        let currentChoice = 'even';
        let currentMode = 'random';
        let totalX = 0;
        let totalY = 0;

        function closeModal() {
            document.getElementById('welcomeModal').style.display = 'none';
            checkBonusTimer();
        }

        function selectChoice(choice) {
            currentChoice = choice;
            document.getElementById('cardEven').classList.remove('selected');
            document.getElementById('cardOdd').classList.remove('selected');
            if (choice === 'even') {
                document.getElementById('cardEven').classList.add('selected');
            } else {
                document.getElementById('cardOdd').classList.add('selected');
            }
        }

        function setBet(amount) {
            document.getElementById('betAmount').value = amount;
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-page').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(b => b.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
            if (tabName === 'wallet') checkBonusTimer();
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('walletBalance').innerText = balance;
        }

        function adminAddMoney() {
            balance += 10000;
            updateBalance();
            alert('⚙️ Админ: Начислено 10,000 фишек!');
        }

        function changeChance() {
            currentMode = document.getElementById('winChance').value;
        }

        function rollDice() {
            const betInput = document.getElementById('betAmount');
            let bet = parseInt(betInput.value);

            if (isNaN(bet) || bet <= 0) {
                alert('Введите корректную сумму ставки!');
                return;
            }

            if (balance < bet) {
                alert('Недостаточно фишек на балансе!');
                return;
            }

            balance -= bet;
            updateBalance();

            const btn = document.getElementById('rollBtn');
            btn.disabled = true;

            let resultNumber;
            if (currentMode === 'win') {
                resultNumber = currentChoice === 'even' ? 2 : 3;
            } else if (currentMode === 'lose') {
                resultNumber = currentChoice === 'even' ? 3 : 2;
            } else {
                resultNumber = Math.floor(Math.random() * 6) + 1;
            }

            const targetRotations = {
                1: { x: 0, y: 0 },
                6: { x: 0, y: 180 },
                3: { x: 0, y: -90 },
                4: { x: 0, y: 90 },
                2: { x: -90, y: 0 },
                5: { x: 90, y: 0 }
            };

            const cube = document.getElementById('cube');
            
            totalX += (Math.floor(Math.random() * 6) + 8) * 360;
            totalY += (Math.floor(Math.random() * 6) + 8) * 360;

            let finalX = totalX + targetRotations[resultNumber].x;
            let finalY = totalY + targetRotations[resultNumber],y;

            cube.style.transform = `translateZ(-60px) rotateX(${finalX}deg) rotateY(${finalY}deg)`;

            setTimeout(() => {
                let isEven = resultNumber % 2 === 0;
                let userWon = (currentChoice === 'even' && isEven) || (currentChoice === 'odd' && !isEven);

                if (userWon) {
                    let winAmount = bet * 2;
                    balance += winAmount;
                    alert(`✨ ПОБЕДА! Выпало ${resultNumber}. Выигрыш: ${winAmount} 💎!`);
                } else {
                    alert(`🎲 Выпало ${resultNumber}. Ставка не сыграла.`);
                }

                updateBalance();
                btn.disabled = false;
            }, 5000);
        }

        function checkBonusTimer() {
            const lastBonus = localStorage.getItem('lastBonusTime');
            const bonusBtn = document.getElementById('bonusBtn');
            const bonusTimer = document.getElementById('bonusTimer');

            if (lastBonus) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastBonus);
                const twentyFourHours = 24 * 60 * 60 * 1000;

                if (timePassed < twentyFourHours) {
                    bonusBtn.disabled = true;
                    const timeLeft = twentyFourHours - timePassed;
                    const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    bonusTimer.innerText = `Бонус доступен через: ${hours}ч ${minutes}мин`;
                    return false;
                }
            }

            bonusBtn.disabled = false;
            bonusTimer.innerText = "Бонус готов к получению!";
            return true;
        }

        function addBonus() {
            if (!checkBonusTimer()) {
                alert('Бонус можно получать один раз в 24 часа!');
                return;
            }

            balance += 500;
            updateBalance();
            localStorage.setItem('lastBonusTime', new Date().getTime().toString());
            checkBonusTimer();
            alert('🎉 Бонус успешно получен: +500 фишек!');
        }

        checkBonusTimer();
    </script>
</body>
</html>
