<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PavelCasino Dice</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: #0f0c1b; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 3, 12, 0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-card { background: #18132b; border: 1px solid #7b2cbf; border-radius: 20px; padding: 25px; text-align: center; max-width: 320px; box-shadow: 0 0 30px rgba(123, 44, 191, 0.4); }
        .modal-card h2 { color: #00f5d4; margin-bottom: 12px; font-size: 22px; text-shadow: 0 0 10px rgba(0, 245, 212, 0.5); }
        .modal-card p { font-size: 14px; color: #b8b2d8; line-height: 1.5; margin-bottom: 20px; }
        
        .btn-action { 
            background: linear-gradient(135deg, #7b2cbf, #5a189a); 
            color: #ffffff; 
            border: 1px solid #9d4edd; 
            padding: 14px 24px; 
            font-weight: 700; 
            border-radius: 12px; 
            font-size: 15px; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }
        .btn-action:active { transform: scale(0.97); opacity: 0.9; }
        .btn-action:disabled { background: #2b2640; border-color: #3d355c; color: #6c638a; box-shadow: none; cursor: not-allowed; }

        .header { background: #140f26; padding: 15px 20px; text-align: center; border-bottom: 1px solid #281e47; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; color: #00f5d4; font-size: 18px; letter-spacing: 0.5px; text-shadow: 0 0 8px rgba(0, 245, 212, 0.4); }
        .balance-badge { background: #1f1838; border: 1px solid #00f5d4; padding: 6px 14px; border-radius: 20px; color: #00f5d4; font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); }

        .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .tab-page { display: none; width: 100%; text-align: center; max-width: 400px; }
        .tab-page.active { display: block; }

        /* Секция кубика */
        .dice-container { 
            background: #140f26; 
            border: 2px solid #3c2a63; 
            border-radius: 16px; 
            padding: 25px; 
            margin: 15px 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(123, 44, 191, 0.2); 
        }
        .dice { 
            width: 100px; 
            height: 100px; 
            background: #0a0812; 
            border: 3px solid #7b2cbf; 
            border-radius: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 55px; 
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.4);
            transition: transform 0.1s;
        }
        .dice.rolling { animation: rollAnim 0.15s infinite; }

        @keyframes rollAnim {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(15deg); }
            100% { transform: scale(1) rotate(-15deg); }
        }

        /* Выбор Чёт / Нечёт */
        .choice-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .choice-btn { 
            flex: 1; 
            background: #140f26; 
            border: 2px solid #3c2a63; 
            color: #b8b2d8; 
            padding: 12px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px;
            transition: 0.2s;
        }
        .choice-btn.selected { 
            background: #1f1838; 
            border-color: #00f5d4; 
            color: #00f5d4; 
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }

        .bet-control { background: #140f26; border: 1px solid #281e47; border-radius: 14px; padding: 14px; margin-bottom: 15px; }
        .bet-title { font-size: 13px; color: #a095c4; margin-bottom: 10px; }
        .bet-buttons { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; }
        .bet-btn { background: #1f1838; border: 1px solid #5a189a; color: #00f5d4; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .bet-btn:active { background: #7b2cbf; color: #fff; }
        .bet-input { width: 100%; background: #0a0812; border: 1px solid #7b2cbf; color: #00f5d4; padding: 10px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; outline: none; }

        .admin-box { background: #140f26; border: 1px dashed #7b2cbf; border-radius: 14px; padding: 16px; margin-top: 10px; text-align: left; }
        .admin-box h4 { color: #00f5d4; margin-bottom: 12px; text-align: center; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; color: #d0c9eb; }
        .admin-row select, .admin-row button { background: #1f1838; color: #00f5d4; border: 1px solid #7b2cbf; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .nav-tabs { display: flex; background: #140f26; border-top: 1px solid #281e47; height: 65px; }
        .tab-btn { flex: 1; background: none; border: none; color: #6c638a; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #00f5d4; font-weight: bold; }
        .tab-btn span { font-size: 20px; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="welcomeModal">
        <div class="modal-card">
            <h2>PavelCasino Dice 🎲</h2>
            <p>Добро пожаловать!<br><br>Вам начислено <b>1,000 фишек</b>. Угадывайте чётное или нечётное число на кубике и побеждайте!</p>
            <button class="btn-action" onclick="closeModal()">Играть</button>
        </div>
    </div>

    <div class="header">
        <div class="logo">PavelCasino</div>
        <div class="balance-badge">💎 <span id="balance">1000</span></div>
    </div>

    <div class="content">
        <!-- Вкладка игры в кости -->
        <div id="tab-games" class="tab-page active">
            <h3 style="color: #e2dcff; margin-bottom: 5px;">Бросок кубика (x2)</h3>
            
            <div class="dice-container">
                <div class="dice" id="diceEl">🎲</div>
            </div>

            <!-- Выбор Чёт / Нечёт -->
            <div class="choice-container">
                <button class="choice-btn selected" id="btnEven" onclick="selectChoice('even')">ЧЁТНОЕ (2, 4, 6)</button>
                <button class="choice-btn" id="btnOdd" onclick="selectChoice('odd')">НЕЧЁТНОЕ (1, 3, 5)</button>
            </div>

            <div class="bet-control">
                <div class="bet-title">Сумма ставки:</div>
                <div class="bet-buttons">
                    <button class="bet-btn" onclick="setBet(50)">50</button>
                    <button class="bet-btn" onclick="setBet(100)">100</button>
                    <button class="bet-btn" onclick="setBet(250)">250</button>
                    <button class="bet-btn" onclick="setBet(500)">500</button>
                </div>
                <input type="number" id="betAmount" class="bet-input" value="100" min="10" step="10">
            </div>

            <button class="btn-action" id="rollBtn" onclick="rollDice()">Бросить кубик 🎲</button>
        </div>

        <!-- Вкладка Кошелек -->
        <div id="tab-wallet" class="tab-page">
            <h3 style="color: #e2dcff;">Кошелек</h3>
            <p style="margin: 15px 0; color: #a095c4;">Баланс: <b id="walletBalance" style="color:#00f5d4;">1000</b> фишек</p>
            <button class="btn-action" id="bonusBtn" onclick="addBonus()">Забрать дневной бонус (+500 💎)</button>
            <p id="bonusTimer" style="margin-top: 12px; font-size: 13px; color: #887fa3;"></p>
        </div>

        <!-- Вкладка Админ -->
        <div id="tab-profile" class="tab-page">
            <h3 style="color: #e2dcff;">⚙️ Админ-Панель</h3>
            <div class="admin-box">
                <h4>Настройки</h4>
                <div class="admin-row">
                    <span>Накрутка баланса:</span>
                    <button onclick="adminAddMoney()">+10,000 💎</button>
                </div>
                <div class="admin-row" style="margin-top: 15px;">
                    <span>Режим броска:</span>
                    <select id="winChance" onchange="changeChance()">
                        <option value="random">Обычный (Рандом)</option>
                        <option value="win">Всегда выигрыш</option>
                        <option value="lose">Всегда проигрыш</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('games', this)">
            <span>🎲</span> Кости
        </button>
        <button class="tab-btn" onclick="switchTab('wallet', this)">
            <span>💎</span> Баланс
        </button>
        <button class="tab-btn" onclick="switchTab('profile', this)">
            <span>⚙️</span> Админ
        </button>
    </div>

    <script>
        let balance = 1000;
        let currentChoice = 'even'; // 'even' или 'odd'
        let currentMode = 'random';
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function closeModal() {
            document.getElementById('welcomeModal').style.display = 'none';
            checkBonusTimer();
        }

        function selectChoice(choice) {
            currentChoice = choice;
            document.getElementById('btnEven').classList.remove('selected');
            document.getElementById('btnOdd').classList.remove('selected');
            if (choice === 'even') {
                document.getElementById('btnEven').classList.add('selected');
            } else {
                document.getElementById('btnOdd').classList.add('selected');
            }
        }

        function setBet(amount) {
            document.getElementById('betAmount').value = amount;
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-page').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
            if (tabName === 'wallet') checkBonusTimer();
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('walletBalance').innerText = balance;
        }

        function adminAddMoney() {
            balance += 10000;
            updateBalance();
            alert('⚙️ Админ: Начислено 10,000 фишек!');
        }

        function changeChance() {
            currentMode = document.getElementById('winChance').value;
        }

        function rollDice() {
            const betInput = document.getElementById('betAmount');
            let bet = parseInt(betInput.value);

            if (isNaN(bet) || bet <= 0) {
                alert('Введите корректную сумму ставки!');
                return;
            }

            if (balance < bet) {
                alert('Недостаточно баланса!');
                return;
            }

            balance -= bet;
            updateBalance();

            const btn = document.getElementById('rollBtn');
            btn.disabled = true;
            const diceEl = document.getElementById('diceEl');
            diceEl.classList.add('rolling');

            let interval = setInterval(() => {
                let randomFace = Math.floor(Math.random() * 6);
                diceEl.innerText = diceFaces[randomFace];
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                diceEl.classList.remove('rolling');

                let resultNumber; // от 1 до 6

                if (currentMode === 'win') {
                    // Подстраиваем под выбор игрока
                    resultNumber = currentChoice === 'even' ? 2 : 3; // 2 - чёт, 3 - нечёт
                } else if (currentMode === 'lose') {
                    resultNumber = currentChoice === 'even' ? 3 : 2;
                } else {
                    resultNumber = Math.floor(Math.random() * 6) + 1;
                }

                diceEl.innerText = diceFaces[resultNumber - 1];

                let isEven = resultNumber % 2 === 0;
                let userWon = (currentChoice === 'even' && isEven) || (currentChoice === 'odd' && !isEven);

                if (userWon) {
                    let winAmount = bet * 2;
                    balance += winAmount;
                    alert(`🎉 Выпало ${resultNumber}! Вы выиграли ${winAmount} 💎!`);
                } else {
                    alert(`😢 Выпало ${resultNumber}. Вы проиграли ставку.`);
                }

                updateBalance();
                btn.disabled = false;
            }, 1000);
        }

        function checkBonusTimer() {
            const lastBonus = localStorage.getItem('lastBonusTime');
            const bonusBtn = document.getElementById('bonusBtn');
            const bonusTimer = document.getElementById('bonusTimer');

            if (lastBonus) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastBonus);
                const twentyFourHours = 24 * 60 * 60 * 1000;

                if (timePassed < twentyFourHours) {
                    bonusBtn.disabled = true;
                    const timeLeft = twentyFourHours - timePassed;
                    const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    bonusTimer.innerText = `Следующий бонус через: ${hours}ч ${minutes}мин`;
                    return false;
                }
            }

            bonusBtn.disabled = false;
            bonusTimer.innerText = "Бонус доступен!";
            return true;
        }

        function addBonus() {
            if (!checkBonusTimer()) {
                alert('Бонус доступен раз в 24 часа!');
                return;
            }

            balance += 500;
            updateBalance();
            localStorage.setItem('lastBonusTime', new Date().getTime().toString());
            checkBonusTimer();
            alert('🎉 Получен бонус +500 фишек!');
        }

        checkBonusTimer();
    </script>
</body>
</html>
